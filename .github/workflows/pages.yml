# Builds the web app and publishes it on GitHub Pages (HTTPS, so phones can use GPS).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # set this repository variable to your SafeRaah server's https address to turn on
          # live trip links, live reports and reviews
          # the SafeRaah server on Google Cloud Run (a repository variable overrides it)
          VITE_API_BASE: ${{ vars.SAFERAAH_API_BASE || 'https://saferaah-87901400101.asia-south1.run.app' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
